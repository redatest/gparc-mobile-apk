name: gparc_mobile
description: Application Android hors ligne de gestion du parc informatique GParc.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  mobile_scanner: ^6.0.10
  share_plus: ^10.1.4
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - gparc inventaire.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "gparc inventaire.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "gparc inventaire.jpg"
  min_sdk_android: 21
