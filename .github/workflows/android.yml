name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --android-language java --org dz.sonelgaz --project-name gparc_mobile .
      - name: Install native shutter sound handler
        run: |
          mkdir -p android/app/src/main/java/dz/sonelgaz/gparc_mobile
          cp tooling/MainActivity.java android/app/src/main/java/dz/sonelgaz/gparc_mobile/MainActivity.java
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gparc-mobile-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable APK filename
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/gparc-mobile.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Dernier APK GParc Mobile
          body: APK Debug généré automatiquement après validation de l'analyse Flutter, des tests et de la compilation.
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/gparc-mobile.apk
          overwrite_files: true
          fail_on_unmatched_files: true
